name: Auto Start VeloCut Bootstrap

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Start bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bootstrap.yml --repo "${{ github.repository }}" --ref main
