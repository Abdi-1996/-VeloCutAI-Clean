name: Bootstrap VeloCut Clean

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velocut-clean-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-and-build:
    runs-on: macos-15

    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import latest VeloCut v0.4.8 source
        run: |
          rm -rf _source VeloCutAI
          git clone --depth 1 --branch velocut-build https://github.com/Abdi-1996/edit.git _source
          cp -R _source/VeloCutAI ./VeloCutAI
          rm -rf _source

      - name: Create clean future build workflow
        run: |
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'YAML'
          name: Build VeloCut AI Clean IPA

          on:
            workflow_dispatch:
            push:
              branches: [ main ]
              paths:
                - 'VeloCutAI/**'
                - '.github/workflows/build.yml'

          permissions:
            contents: read

          concurrency:
            group: velocut-clean-build
            cancel-in-progress: true

          jobs:
            build:
              runs-on: macos-15
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Prepare v0.4.2 patcher
                  run: |
                    python3 - <<'PY'
                    from pathlib import Path
                    p = Path('VeloCutAI/patch_v04_interactions.py')
                    s = p.read_text()
                    s = s.replace(r"ForEach\\(0<\\.\\.<3", r"ForEach\\(0\\.\\.<3")
                    p.write_text(s)
                    PY

                - name: Patch original v0.4 interactions
                  run: python3 VeloCutAI/patch_v04_interactions.py
                - name: Patch v0.4.3 smooth finishes
                  run: python3 VeloCutAI/patch_v043_finish.py
                - name: Patch v0.4.4 curve UI
                  run: python3 VeloCutAI/patch_v044_curve_ui.py
                - name: Patch v0.4.4 compile fixes
                  run: python3 VeloCutAI/patch_v044_compile.py
                - name: Fix v0.4.5 patch matchers
                  run: python3 VeloCutAI/patch_v045_matcher_fix.py
                - name: Fix v0.4.5 clip card matcher
                  run: python3 VeloCutAI/patch_v045_card_matcher.py
                - name: Patch v0.4.5 pro UI
                  run: python3 VeloCutAI/patch_v045_pro_ui.py
                - name: Patch v0.4.5 compile fixes
                  run: python3 VeloCutAI/patch_v045_compile.py
                - name: Restore stable v0.4.6 curve editor
                  run: python3 VeloCutAI/patch_v046_curve_stability.py
                - name: Fix v0.4.7 patch matcher
                  run: python3 VeloCutAI/patch_v047_matcher_fix.py
                - name: Patch v0.4.7 clean UI and saved curves
                  run: python3 VeloCutAI/patch_v047_clean_ui.py
                - name: Patch v0.4.7 compile fixes
                  run: python3 VeloCutAI/patch_v047_compile.py
                - name: Patch v0.4.8 RIFE AI Smooth
                  run: python3 VeloCutAI/patch_v048_rife_ai.py

                - name: Install XcodeGen
                  run: brew install xcodegen

                - name: Generate Xcode project
                  working-directory: VeloCutAI
                  run: xcodegen generate

                - name: Build unsigned iOS app
                  working-directory: VeloCutAI
                  run: |
                    set -o pipefail
                    xcodebuild \
                      -project VeloCutAI.xcodeproj \
                      -scheme VeloCutAI \
                      -configuration Release \
                      -sdk iphoneos \
                      -destination 'generic/platform=iOS' \
                      -derivedDataPath build \
                      CODE_SIGNING_ALLOWED=NO \
                      CODE_SIGNING_REQUIRED=NO \
                      CODE_SIGN_IDENTITY='' \
                      build

                - name: Package unsigned IPA
                  working-directory: VeloCutAI
                  run: |
                    APP_PATH="build/Build/Products/Release-iphoneos/VeloCutAI.app"
                    test -d "$APP_PATH"
                    rm -rf Payload
                    mkdir -p Payload
                    cp -R "$APP_PATH" Payload/
                    zip -qry VeloCutAI-v0.4.8-clean-unsigned.ipa Payload

                - name: Upload IPA artifact
                  uses: actions/upload-artifact@v4
                  with:
                    name: VeloCutAI-v0.4.8-clean-unsigned-ipa
                    path: VeloCutAI/VeloCutAI-v0.4.8-clean-unsigned.ipa
                    if-no-files-found: error
          YAML

      - name: Save imported source in clean repository
        run: |
          rm -f .github/workflows/bootstrap.yml
          git config user.name "VeloCut Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Import VeloCut v0.4.8 clean source" || true
          git push origin main

      - name: Prepare v0.4.2 patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VeloCutAI/patch_v04_interactions.py')
          s = p.read_text()
          s = s.replace(r"ForEach\(0<\.\.<3", r"ForEach\(0\.\.<3")
          p.write_text(s)
          PY

      - name: Patch original v0.4 interactions
        run: python3 VeloCutAI/patch_v04_interactions.py
      - name: Patch v0.4.3 smooth finishes
        run: python3 VeloCutAI/patch_v043_finish.py
      - name: Patch v0.4.4 curve UI
        run: python3 VeloCutAI/patch_v044_curve_ui.py
      - name: Patch v0.4.4 compile fixes
        run: python3 VeloCutAI/patch_v044_compile.py
      - name: Fix v0.4.5 patch matchers
        run: python3 VeloCutAI/patch_v045_matcher_fix.py
      - name: Fix v0.4.5 clip card matcher
        run: python3 VeloCutAI/patch_v045_card_matcher.py
      - name: Patch v0.4.5 pro UI
        run: python3 VeloCutAI/patch_v045_pro_ui.py
      - name: Patch v0.4.5 compile fixes
        run: python3 VeloCutAI/patch_v045_compile.py
      - name: Restore stable v0.4.6 curve editor
        run: python3 VeloCutAI/patch_v046_curve_stability.py
      - name: Fix v0.4.7 patch matcher
        run: python3 VeloCutAI/patch_v047_matcher_fix.py
      - name: Patch v0.4.7 clean UI and saved curves
        run: python3 VeloCutAI/patch_v047_clean_ui.py
      - name: Patch v0.4.7 compile fixes
        run: python3 VeloCutAI/patch_v047_compile.py
      - name: Patch v0.4.8 RIFE AI Smooth
        run: python3 VeloCutAI/patch_v048_rife_ai.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: VeloCutAI
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: VeloCutAI
        run: |
          set -o pipefail
          xcodebuild \
            -project VeloCutAI.xcodeproj \
            -scheme VeloCutAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        working-directory: VeloCutAI
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/VeloCutAI.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VeloCutAI-v0.4.8-clean-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloCutAI-v0.4.8-clean-unsigned-ipa
          path: VeloCutAI/VeloCutAI-v0.4.8-clean-unsigned.ipa
          if-no-files-found: error
